<!doctype html><html lang="nb"><head><meta charset="utf-8"><title>Aars — aars.no</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>html,body{margin:0;background:var(--surface-page)}#root{min-height:100vh}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./Forsiden.jsx"></script>
<script type="text/babel" src="./OmAars.jsx"></script>
<script type="text/babel" src="./Aktuelt.jsx"></script>
<script type="text/babel" src="./Artikkel.jsx"></script>
<script type="text/babel" src="./Kontakt.jsx"></script>
<script type="text/babel">
const { Menu, MenuOverlay, Footer, CookieBanner } = window.AarsDesignSystem_80df3d;
const NAV = [["forsiden","Forsiden"],["om-aars","Om Aars"],["aktuelt","Aktuelt"],["artikkel","Artikkel"],["kontakt","Kontakt oss"]];

function App(){
  const [page,setPage] = React.useState("forsiden");
  const [menuOpen,setMenuOpen] = React.useState(false);
  const [cookies,setCookies] = React.useState(true);
  const go = (p) => { setPage(p); setMenuOpen(false); window.scrollTo(0,0); };
  const darkHeader = page === "forsiden" || page === "om-aars" || page === "artikkel";
  const Screen = { forsiden: window.Forsiden, "om-aars": window.OmAars, aktuelt: window.Aktuelt, artikkel: window.Artikkel, kontakt: window.Kontakt }[page];
  return (
    <div style={{position:"relative",minHeight:"100vh",overflowX:"hidden"}}>
      <header style={{position:"absolute",top:0,left:0,right:0,zIndex:5,display:"flex",justifyContent:"center",padding:"50px 64px 0",pointerEvents:"none"}}>
        <div style={{pointerEvents:"auto",width:1306,maxWidth:"100%"}}>
          <Menu breakpoint="desktop" tone={darkHeader ? "light" : "dark"} links={["Om Aars"]} onMenuClick={()=>setMenuOpen(true)} />
        </div>
      </header>
      <main style={{paddingTop: darkHeader ? 0 : 130}}><Screen go={go} /></main>
      <Footer breakpoint="desktop" onTop={()=>window.scrollTo({top:0,behavior:"smooth"})} />
      <MenuOverlay open={menuOpen} items={NAV.map(n=>n[1])} activeItem={(NAV.find(n=>n[0]===page)||[])[1]}
        onSelect={(label)=>go((NAV.find(n=>n[1]===label)||["forsiden"])[0])} onClose={()=>setMenuOpen(false)}
        style={{position:"fixed",zIndex:20}} />
      {cookies ? <div style={{position:"fixed",left:0,right:0,bottom:0,zIndex:15}}><CookieBanner onAccept={()=>setCookies(false)} /></div> : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
